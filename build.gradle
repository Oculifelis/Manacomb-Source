plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = "${mod_version}+${minecraft_version}-neoforge"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'BlameJared (Botania, JEI)'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'vazkii.botania'
            includeGroup 'mezz.jei'
        }
    }
}

// Complicated Bees and Jade are compiled against their release jars in libs/, which tools/fetch_libs.sh
// fills. Botania comes from its maven. Nothing from them ends up in the built jar. All of them are
// compileOnly: the mods present at runtime come from the mods/ folder of each run (tools/set_mods.sh).
def libJar = { String name ->
    def f = file("libs/${name}")
    if (!f.exists()) throw new GradleException("libs/${name} is missing: run tools/fetch_libs.sh first")
    return f
}

dependencies {
    compileOnly files(libJar(cb_jar))
    compileOnly files(libJar(jade_jar))
    compileOnly("vazkii.botania:botania-neoforge-${minecraft_version}:${botania_version}") { transitive = false }
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
}

// Dev-only GameTests: a second mod, manaflux_gametest, loaded only in the gameTestServer run. None of it ships.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
dependencies {
    gametestCompileOnly files(libJar(cb_jar))
    gametestCompileOnly("vazkii.botania:botania-neoforge-${minecraft_version}:${botania_version}") { transitive = false }
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'manaflux_gametest'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            jvmArgument '-Xmx3G'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        manaflux_gametest {
            sourceSet(sourceSets.gametest)
        }
    }
}
neoForge.addModdingDependenciesTo(sourceSets.gametest)

// The normal runs load only the shipped mod; the GameTest run adds the test mod.
neoForge.runs.client.loadedMods = [neoForge.mods.manaflux]
neoForge.runs.server.loadedMods = [neoForge.mods.manaflux]
neoForge.runs.gameTestServer.loadedMods = [neoForge.mods.manaflux, neoForge.mods.manaflux_gametest]

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
